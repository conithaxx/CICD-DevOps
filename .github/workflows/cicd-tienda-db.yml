name: CI/CD Tienda Perritos - DB 1

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "db/**"

jobs:
  build-push-deploy-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID1 }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY1 }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN1 }}
        aws-region: "us-east-1"

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen DB y push a ECR
      run: |
        cd db
        docker build -t tienda-db .
        docker tag tienda-db:latest ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest
        docker push ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest

    - name: Desplegar DB vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID1 }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-db desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com",
            "docker pull ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest",
            "docker stop tienda-db || true",
            "docker rm tienda-db || true",
            "docker run -d --name tienda-db -p 3306:3306 -v dbdata:/var/lib/mysql ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-db:latest"
          ]}' \
          --region us-east-1 \
          --output text
