name: CI/CD Tienda Perritos - Backend 1

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "backend/**"

jobs:
  build-push-deploy-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID1 }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY1 }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN1 }}
        aws-region: "us-east-1"

    - name: Login en Amazon ECR (runner)
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build imagen Backend y push a ECR
      run: |
        cd backend
        docker build -t tienda-backend .
        docker tag tienda-backend:latest ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest
        docker push ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest

    - name: Desplegar Backend vía SSM
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID1 }} \
          --document-name "AWS-RunShellScript" \
          --comment "Actualizar tienda-backend desde ECR" \
          --parameters '{"commands":[
            "set -e",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com",
            "docker pull ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest",
            "docker stop tienda-backend || true",
            "docker rm tienda-backend || true",
            "docker run -d --name tienda-backend -p 3001:3001 ${{ secrets.ECR_REGISTRY1 }}.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest"
          ]}' \
          --region us-east-1 \
          --output text
